
services:
  postgres:
    image: postgres:17
    container_name: car-dealership-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dealership
      POSTGRES_PASSWORD: dealership_password
      POSTGRES_DB: car_dealership
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: